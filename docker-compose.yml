services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: knowledge_inbox
      POSTGRES_USER: knowledge_user
      POSTGRES_PASSWORD: knowledge_password
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_user -d knowledge_inbox"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
